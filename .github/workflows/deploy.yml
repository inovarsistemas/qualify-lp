name: CI/CD

# PR  -> só valida (lint + typecheck).
# main -> valida e, se passar, publica no servidor (OVH).
# Também pode ser disparado manualmente (Actions -> Run workflow).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Lint e typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  deploy:
    name: Deploy em produção
    needs: check
    # PR nunca publica: só push na main ou execução manual.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    # Um deploy por vez; não cancela um que já está rodando.
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Preparar SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ci
          chmod 600 ~/.ssh/id_ci
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # A chave de CI só executa ~/bin/ci-deploy-qualify.sh no servidor
      # (comando forçado no authorized_keys): git pull da main +
      # scripts/deploy.sh, que espera o app responder e imprime diagnóstico se
      # falhar.
      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_ci -p "$SSH_PORT" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST"
